<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATELIER</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232f5d4b'/%3E%3Ctext x='32' y='42' font-size='28' text-anchor='middle' fill='white' font-family='Georgia'%3Eat%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#fffcf6; --panel:#ffffff; --line:#e9e1d1; --text:#1f2421; --muted:#7a7468;
    --accent:#2f5d4b; --accent-2:#3b6e5a; --accent-soft:#e8f0eb; --rose:#b5577a; --bad:#d14b4b;
    --kr:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;
    --serif:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font:400 15px/1.65 var(--kr);word-break:keep-all;
       display:flex;align-items:center;justify-content:center;padding:24px 16px;-webkit-font-smoothing:antialiased}
  .card{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:18px;
        padding:36px 28px 30px;text-align:center;box-shadow:0 10px 30px rgba(60,48,20,.08)}
  .logo{width:52px;height:52px;margin:0 auto 14px;border:1.5px solid var(--accent);color:var(--accent);border-radius:13px;
        display:flex;align-items:center;justify-content:center;font:700 22px/1 var(--serif)}
  h1{margin:0;font:700 22px/1.3 var(--serif);letter-spacing:.14em}
  .sub{margin:2px 0 22px;color:var(--muted);font-size:12px;letter-spacing:.22em}
  .msg{margin:0;font-size:15px}
  .hint{margin:8px 0 0;color:var(--muted);font-size:13px}
  .spin{width:22px;height:22px;margin:0 auto 14px;border:2.5px solid var(--accent-soft);border-top-color:var(--accent);
        border-radius:50%;animation:r .9s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
  .btn{display:inline-block;margin-top:18px;border:0;background:var(--accent);color:#fff;border-radius:12px;
       padding:10px 18px;font:700 14px var(--kr);cursor:pointer;text-decoration:none}
  .btn:hover{background:var(--accent-2)}
  .off .msg{color:var(--bad)}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main class="card" id="card">
  <div class="logo">at</div>
  <h1>ATELIER</h1>
  <p class="sub">CREATIVE WORKSPACE</p>
  <div id="wait"><div class="spin"></div><p class="msg">ATELIER 를 여는 중입니다…</p></div>
  <div id="off" hidden>
    <p class="msg">지금은 ATELIER 서버가 꺼져 있습니다.</p>
    <p class="hint">서버 컴퓨터가 켜지면 이 주소로 다시 열립니다. 잠시 뒤 다시 시도해 주세요.</p>
    <button class="btn" id="retry" type="button">다시 시도</button>
  </div>
</main>
<script>
"use strict";
// 이 페이지는 고정 주소 역할만 한다: 서버 컴퓨터가 올려 둔 url.json 의 주소로 넘겨 준다(1113).
// 주소는 서버 컴퓨터의 atelier/public_tunnel.py 가 터널을 열 때마다 고친다.
const REPO = "disroom/atelier";

function timeout(ms) { const c = new AbortController(); setTimeout(() => c.abort(), ms); return c.signal; }

async function currentUrl() {
  const tries = [
    // GitHub API 는 올린 즉시 새 값이 보인다. 시간당 60번 제한이 있어 페이지 쪽 파일을 뒤에 둔다.
    () => fetch(`https://api.github.com/repos/${REPO}/contents/url.json`,
                { headers: { Accept: "application/vnd.github.raw+json" }, cache: "no-store", signal: timeout(6000) }),
    () => fetch(`url.json?t=${Date.now()}`, { cache: "no-store", signal: timeout(6000) }),
  ];
  for (const t of tries) {
    try {
      const r = await t();
      if (!r.ok) continue;
      const d = await r.json();
      if (d && /^https:\/\/[a-z0-9.-]+$/i.test(d.url || "")) return d.url;
    } catch (e) { /* 다음 방법 */ }
  }
  return null;
}

async function alive(url) {
  try {
    const r = await fetch(`${url}/api/me`, { cache: "no-store", signal: timeout(8000) });
    return r.ok;
  } catch (e) { return false; }
}

async function go() {
  document.getElementById("wait").hidden = false;
  document.getElementById("off").hidden = true;
  document.getElementById("card").classList.remove("off");
  const url = await currentUrl();
  if (url && await alive(url)) { location.replace(url + "/" + location.hash); return; }
  document.getElementById("wait").hidden = true;
  document.getElementById("off").hidden = false;
  document.getElementById("card").classList.add("off");
}
document.getElementById("retry").onclick = go;
go();
</script>
</body>
</html>
